<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Zentra</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; background: #fff; color: #1d1d1f; text-align: center; padding: 24px; }
    @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } p { color: #98989d; } }
    h1 { font-size: 32px; letter-spacing: -0.03em; margin: 20px 0 8px; }
    p { color: #6e6e73; max-width: 320px; margin: 0 auto 24px; line-height: 1.5; }
    button { border: 0; border-radius: 999px; background: #0071e3; color: #fff; font: inherit; font-weight: 500; padding: 10px 22px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/brand/zentra-mark.svg" width="64" height="64" alt="" />
    <h1>You're offline.</h1>
    <p>Prices and balances need a connection. We'll be right here when you're back.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
