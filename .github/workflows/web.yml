# CI for the Zentra web app (apps/web).
#
# Deployment is handled by Vercel's Git integration: every push to main goes to
# production and other branches/PRs get preview deployments automatically.
# This workflow runs typecheck + build on every push and PR so broken code is
# flagged. To block merging on failure, require the "Typecheck & build" check in
# GitHub -> Settings -> Branches.

name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck web
        run: npm run typecheck -w apps/web

      - name: Typecheck API (web depends on its contract)
        run: |
          npx -w apps/api prisma generate
          npm run typecheck -w apps/api

      - name: Build web
        run: npm run build -w apps/web
